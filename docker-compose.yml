# Dokploy Compose deployment for the UMP-X MCP server.
#
# Dokploy clones the `deploy` branch, writes the Environment tab into `.env`
# next to this file, and runs `docker compose up -d --build`. Everything the
# service needs comes from that `.env` (UMP_MCP_* plus UMP_MCP_DOMAIN); nothing
# secret lives in the repo.

services:
  ump-x-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    expose:
      - "${UMP_MCP_PORT:-8000}"
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network

      # HTTPS
      - traefik.http.routers.ump-x-mcp.rule=Host(`${UMP_MCP_DOMAIN:-ump-mcp.localhost}`)
      - traefik.http.routers.ump-x-mcp.entrypoints=websecure
      - traefik.http.routers.ump-x-mcp.tls=true
      - traefik.http.routers.ump-x-mcp.tls.certresolver=letsencrypt
      - traefik.http.routers.ump-x-mcp.service=ump-x-mcp

      # Plain HTTP -> HTTPS
      - traefik.http.routers.ump-x-mcp-web.rule=Host(`${UMP_MCP_DOMAIN:-ump-mcp.localhost}`)
      - traefik.http.routers.ump-x-mcp-web.entrypoints=web
      - traefik.http.routers.ump-x-mcp-web.middlewares=ump-x-mcp-https
      - traefik.http.middlewares.ump-x-mcp-https.redirectscheme.scheme=https

      - traefik.http.services.ump-x-mcp.loadbalancer.server.port=${UMP_MCP_PORT:-8000}

networks:
  dokploy-network:
    external: true
